name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:transition
      - run: npm run check:no-direct-supabase
      - run: npm run build
      - run: npm run check:deploy-env
        env:
          VITE_BACKEND_API_BASE_URL: https://api.tartelea.com/api/v1
          VITE_LIVEKIT_URL: wss://rtc.tartelea.com
          VITE_USE_BACKEND_COMMUNITY: "true"
      - run: docker build --build-arg VITE_BACKEND_API_BASE_URL=https://api.tartelea.com/api/v1 --build-arg VITE_LIVEKIT_URL=wss://rtc.tartelea.com --build-arg VITE_USE_BACKEND_COMMUNITY=true -t tartelea-web-ci .

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: node --check scripts/migrate_db.js
        working-directory: backend
      - run: docker build -t tartelea-backend-ci .
        working-directory: backend
